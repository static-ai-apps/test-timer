<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Metronome</title>
<meta name="description" content="A steady beat for practice, on your phone. Works offline.">
<meta name="theme-color" content="#2b1b13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e6decf" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<!-- SPEC §10, ADVICE §17: one description in fixed schema.org terms. A new app rewrites it; `url` must be its own. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Pocket Metronome",
  "disambiguatingDescription": "A steady beat for practice, on your phone.",
  "description": "A metronome for practicing on a phone. Set a tempo by slider, buttons or tapping, choose beats per bar, and keep playing offline.",
  "url": "https://static-ai-apps.github.io/test-timer/",
  "applicationCategory": "MultimediaApplication",
  "featureList": ["Tempo from 20 to 300 BPM", "Tap tempo", "1 to 12 beats per bar", "Accented first beat", "Keeps the screen awake while playing", "Works offline"],
  "audience": { "@type": "Audience", "audienceType": "Musicians practicing alone or in small groups" },
  "inLanguage": "en",
  "browserRequirements": "Needs Web Audio",
  "accessibilityFeature": ["fullKeyboardControl"],
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "image": "https://static-ai-apps.github.io/test-timer/icon.png",
  "isPartOf": { "@type": "WebSite", "name": "Static AI Apps", "url": "https://static-ai-apps.github.io/" }
}
</script>
<!--
  static-ai-apps app template: example app.

  This metronome exists to show the advice in ADVICE.md (instructions branch)
  in working code. A new app replaces this file entirely. Comments marked
  "ADVICE" point to the relevant section.
-->
<style>
  :root {
    color-scheme: light dark;
    /* Walnut case, brass weight, ivory dial, lacquer downbeat. */
    --bg: #2b1b13;
    --surface: #3a2619;
    --line: #4d3424;
    --text: #f1e6d0;
    --muted: #b49d84;
    --brass: #d1ad55;
    --brass-ink: #2b1b13;
    --lacquer: #c4483d;
    --focus: #f6d98a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e6decf;
      --surface: #f2ece0;
      --line: #cdbfa6;
      --text: #2b1b13;
      --muted: #6d5a47;
      --brass: #8a6a1e;
      --brass-ink: #fbf6ea;
      --lacquer: #a32e25;
      --focus: #2b1b13;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ADVICE §5: dvh, not vh; safe areas for notches and home indicators. */
  .app {
    min-height: 100dvh;
    max-width: 30rem;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    padding:
      calc(env(safe-area-inset-top) + 12px)
      calc(env(safe-area-inset-right) + 20px)
      calc(env(safe-area-inset-bottom) + 12px)
      calc(env(safe-area-inset-left) + 20px);
    gap: 8px;
  }

  header h1 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
  }

  /* The one memorable thing: a pendulum whose weight slides with the tempo. */
  .stage {
    display: grid;
    place-items: center;
    min-height: 0;
  }
  .pendulum { width: min(62vw, 15rem); height: auto; max-height: 40dvh; overflow: visible; }
  .case { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
  .scale line { stroke: var(--line); stroke-width: 2; stroke-linecap: round; }
  .arm line { stroke: var(--brass); stroke-width: 4; stroke-linecap: round; }
  .weight { fill: var(--brass); }
  .pivot { fill: var(--brass); }

  .readout { text-align: center; }
  .bpm {
    display: block;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(4.5rem, 24vw, 6.5rem);
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .bpm-unit { color: var(--muted); font-size: 0.95rem; }

  .beats {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 14px 0 4px;
    min-height: 18px;
    flex-wrap: wrap;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--line);
    transition: background-color 60ms linear;
  }
  .dot.down { border-color: var(--lacquer); }
  .dot.on { background: var(--brass); border-color: var(--brass); }
  .dot.down.on { background: var(--lacquer); border-color: var(--lacquer); }

  .controls { display: grid; gap: 14px; padding-top: 8px; }

  .tempo-row { display: grid; grid-template-columns: 48px 1fr 48px; gap: 12px; align-items: center; }

  /* ADVICE §5: 44px+ targets; touch-action stops double-tap zoom on fast taps. */
  button {
    font: inherit;
    color: inherit;
    min-height: 48px;
    min-width: 48px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--surface);
    touch-action: manipulation;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .step { font-size: 1.5rem; line-height: 1; }

  input[type="range"] {
    width: 100%;
    height: 48px;
    margin: 0;
    accent-color: var(--brass);
    touch-action: manipulation;
  }

  .settings { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .meter { display: flex; align-items: center; gap: 8px; }
  .meter .value { min-width: 2ch; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meter-label { color: var(--muted); }

  .toggle { padding: 0 14px; display: inline-flex; align-items: center; gap: 10px; }
  .toggle::before {
    content: ""; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--muted);
  }
  .toggle[aria-pressed="true"] { border-color: var(--lacquer); }
  .toggle[aria-pressed="true"]::before { background: var(--lacquer); border-color: var(--lacquer); }

  .main-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
  .start {
    background: var(--brass);
    border-color: var(--brass);
    color: var(--brass-ink);
    font-weight: 700;
    font-size: 1.25rem;
    min-height: 64px;
  }
  .tap { padding: 0 22px; font-weight: 600; min-height: 64px; }

  .hint { margin: 0; color: var(--muted); font-size: 0.875rem; text-align: center; min-height: 1.3em; }

  footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 0.875rem;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  footer { flex-wrap: wrap; }
  footer .links { display: flex; gap: 16px; }
  footer a { color: inherit; text-underline-offset: 3px; }
  footer a:hover { color: var(--text); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ADVICE §10: no swinging for people who asked for less motion. */
  @media (prefers-reduced-motion: reduce) {
    .dot { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Pocket Metronome</h1>
  </header>

  <section class="stage" aria-label="Pendulum">
    <svg class="pendulum" viewBox="0 0 200 240" aria-hidden="true">
      <polygon class="case" points="40,232 160,232 124,14 76,14"/>
      <g class="scale">
        <line x1="92" y1="40" x2="108" y2="40"/>
        <line x1="94" y1="70" x2="106" y2="70"/>
        <line x1="92" y1="100" x2="108" y2="100"/>
        <line x1="94" y1="130" x2="106" y2="130"/>
        <line x1="92" y1="160" x2="108" y2="160"/>
      </g>
      <g class="arm" id="arm">
        <line x1="100" y1="208" x2="100" y2="22"/>
        <rect class="weight" id="weight" x="88" y="60" width="24" height="18" rx="3"/>
      </g>
      <circle class="pivot" cx="100" cy="208" r="7"/>
    </svg>
  </section>

  <section class="controls" aria-label="Metronome controls">
    <div class="readout">
      <span class="bpm" id="bpm">96</span>
      <span class="bpm-unit">beats per minute</span>
      <div class="beats" id="beats" aria-hidden="true"></div>
    </div>

    <div class="tempo-row">
      <button class="step" id="slower" aria-label="Slower">−</button>
      <label class="sr-only" for="tempo">Tempo</label>
      <input type="range" id="tempo" min="20" max="300" step="1" value="96">
      <button class="step" id="faster" aria-label="Faster">+</button>
    </div>

    <div class="settings">
      <div class="meter" role="group" aria-labelledby="meter-label">
        <span class="meter-label" id="meter-label">Beats per bar</span>
        <button id="fewer" aria-label="Fewer beats per bar">−</button>
        <span class="value" id="meter" aria-live="polite">4</span>
        <button id="more" aria-label="More beats per bar">+</button>
      </div>
      <button class="toggle" id="accent" aria-pressed="true">Accent first beat</button>
    </div>

    <div class="main-row">
      <button class="start" id="start">Start</button>
      <button class="tap" id="tap">Tap tempo</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <footer>
    <span>Works offline once opened.</span>
    <span class="links">
      <!-- ADVICE §15: the changelog is published next to the app. -->
      <a href="CHANGELOG.md">What's new</a>
      <!-- ADVICE §2: one plain link, where a satisfied user would look. No script, no nagging. -->
      <a id="star" href="https://github.com/" hidden>★ Star on GitHub</a>
    </span>
  </footer>
</main>

<script>
"use strict";

/* ---------- Identity and storage (ADVICE §7, SPEC §7) ---------- */

// The first path segment is the repo name on GitHub Pages. Derived, not
// hard-coded, so the prefix stays right if the repo is renamed or copied.
const APP_ID = (() => {
  const seg = location.protocol.startsWith("http")
    ? location.pathname.split("/").filter(Boolean)[0]
    : null;
  return seg && !seg.includes(".") ? seg : "local-app";
})();
const OWNER = location.hostname.endsWith(".github.io")
  ? location.hostname.slice(0, -".github.io".length)
  : null;

const store = {
  key: (name) => `${APP_ID}:${name}`,
  get(name) {
    try { return JSON.parse(localStorage.getItem(this.key(name))); }
    catch { return null; }
  },
  set(name, value) {
    try { localStorage.setItem(this.key(name), JSON.stringify(value)); }
    catch { /* private mode or full: the app still works, it just forgets */ }
  },
};

/* ---------- State ---------- */

const MIN_BPM = 20, MAX_BPM = 300, MIN_BEATS = 1, MAX_BEATS = 12;
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const isInt = (n) => Number.isInteger(n);

// Stored data may have been written by another app or tampered with: validate.
const saved = store.get("settings") || {};
const state = {
  bpm: isInt(saved.bpm) ? clamp(saved.bpm, MIN_BPM, MAX_BPM) : 96,
  beats: isInt(saved.beats) ? clamp(saved.beats, MIN_BEATS, MAX_BEATS) : 4,
  accent: typeof saved.accent === "boolean" ? saved.accent : true,
  playing: false,
};
// ADVICE §9: save when settings change, not on unload.
const save = () => store.set("settings", { bpm: state.bpm, beats: state.beats, accent: state.accent });

/* ---------- Elements ---------- */

const $ = (id) => document.getElementById(id);
const el = {
  bpm: $("bpm"), tempo: $("tempo"), slower: $("slower"), faster: $("faster"),
  meter: $("meter"), fewer: $("fewer"), more: $("more"), accent: $("accent"),
  start: $("start"), tap: $("tap"), hint: $("hint"), beats: $("beats"),
  arm: $("arm"), weight: $("weight"), star: $("star"),
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

/* ---------- Rendering ---------- */

function renderBeats() {
  el.beats.replaceChildren();
  for (let i = 0; i < state.beats; i++) {
    const d = document.createElement("span");
    d.className = "dot" + (i === 0 && state.accent && state.beats > 1 ? " down" : "");
    el.beats.append(d);
  }
}

function render() {
  el.bpm.textContent = state.bpm;
  el.tempo.value = state.bpm;
  el.tempo.setAttribute("aria-valuetext", `${state.bpm} beats per minute`);
  el.meter.textContent = state.beats;
  el.accent.setAttribute("aria-pressed", String(state.accent));
  el.start.textContent = state.playing ? "Stop" : "Start";
  // Like a real metronome: slow tempo, weight high on the arm; fast, weight low.
  const t = (state.bpm - MIN_BPM) / (MAX_BPM - MIN_BPM);
  el.weight.setAttribute("y", String(30 + t * 130));
  renderBeats();
}

function setBpm(n) {
  state.bpm = clamp(Math.round(n), MIN_BPM, MAX_BPM);
  save(); render();
}
function setBeats(n) {
  state.beats = clamp(n, MIN_BEATS, MAX_BEATS);
  save(); render();
}

/* ---------- Audio (ADVICE §8) ---------- */

let ctx = null;
let nextNoteTime = 0;
let beatIndex = 0;
const scheduled = []; // { beat, time } for drawing in sync with the audio clock

// The ticker runs in a worker, built from a Blob so it stays in this file.
// Main-thread timers get throttled in background tabs; worker timers less so.
const ticker = new Worker(URL.createObjectURL(new Blob([`
  let id = null;
  onmessage = (e) => {
    if (e.data === "start") { clearInterval(id); id = setInterval(() => postMessage("tick"), 25); }
    if (e.data === "stop") { clearInterval(id); id = null; }
  };
`], { type: "text/javascript" })));
ticker.onmessage = schedule;

function click(time, strong) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = strong ? 1568 : 1046; // G6 and C6: bright, easy to hear
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(strong ? 0.9 : 0.6, time + 0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  osc.connect(gain).connect(ctx.destination);
  osc.start(time);
  osc.stop(time + 0.06);
}

function schedule() {
  // Look further ahead when hidden, because ticks may arrive late.
  const ahead = document.hidden ? 1.5 : 0.12;
  while (nextNoteTime < ctx.currentTime + ahead) {
    const strong = state.accent && state.beats > 1 && beatIndex === 0;
    click(nextNoteTime, strong);
    scheduled.push({ beat: beatIndex, time: nextNoteTime });
    nextNoteTime += 60 / state.bpm;
    beatIndex = (beatIndex + 1) % state.beats;
  }
}

async function start() {
  // Must happen inside the tap that started playback, or browsers stay silent.
  ctx ||= new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state !== "running") await ctx.resume();
  beatIndex = 0;
  scheduled.length = 0;
  nextNoteTime = ctx.currentTime + 0.06;
  state.playing = true;
  ticker.postMessage("start");
  schedule();
  requestWakeLock();
  render();
  requestAnimationFrame(draw);
}

function stop() {
  state.playing = false;
  ticker.postMessage("stop");
  releaseWakeLock();
  lastBeat = null;
  setArm(0);
  for (const d of el.beats.children) d.classList.remove("on");
  render();
}

/* ---------- Drawing, synced to the audio clock ---------- */

let swingSide = 1;
let lastBeat = null;
function setArm(deg) { el.arm.setAttribute("transform", `rotate(${deg} 100 208)`); }

function draw() {
  if (!state.playing) return;
  const now = ctx.currentTime;
  let last = null;
  while (scheduled.length && scheduled[0].time <= now) last = scheduled.shift() || last;
  if (last) {
    lastBeat = last;
    swingSide = -swingSide;
    const dots = el.beats.children;
    for (let i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i === last.beat);
  }
  if (lastBeat && !reduceMotion.matches) {
    // The arm reaches an extreme on each beat, easing like a pendulum between.
    const interval = 60 / state.bpm;
    const p = Math.min(1, (now - lastBeat.time) / interval);
    setArm(-swingSide * 24 * Math.cos(Math.PI * p));
  }
  requestAnimationFrame(draw);
}

/* ---------- Wake lock (ADVICE §9) ---------- */

let wakeLock = null;
async function requestWakeLock() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch { wakeLock = null; }
}
function releaseWakeLock() { wakeLock?.release().catch(() => {}); wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  // Browsers drop the lock when the page is hidden; take it back on return.
  if (!document.hidden && state.playing) requestWakeLock();
});

/* ---------- Tap tempo ---------- */

let taps = [];
function tap() {
  const t = performance.now();
  if (taps.length && t - taps[taps.length - 1] > 2000) taps = [];
  taps.push(t);
  if (taps.length > 5) taps.shift();
  if (taps.length >= 2) {
    const gaps = taps.slice(1).map((v, i) => v - taps[i]);
    setBpm(60000 / (gaps.reduce((a, b) => a + b) / gaps.length));
  }
}

/* ---------- Input ---------- */

el.start.addEventListener("click", () => (state.playing ? stop() : start()));
el.tap.addEventListener("click", tap);
el.slower.addEventListener("click", () => setBpm(state.bpm - 1));
el.faster.addEventListener("click", () => setBpm(state.bpm + 1));
el.tempo.addEventListener("input", (e) => setBpm(Number(e.target.value)));
el.fewer.addEventListener("click", () => setBeats(state.beats - 1));
el.more.addEventListener("click", () => setBeats(state.beats + 1));
el.accent.addEventListener("click", () => { state.accent = !state.accent; save(); render(); });

document.addEventListener("keydown", (e) => {
  if (e.target.closest("button, input")) return; // let controls handle their own keys
  if (e.code === "Space") { e.preventDefault(); el.start.click(); }
  if (e.key === "t" || e.key === "T") tap();
  if (e.key === "ArrowUp") { e.preventDefault(); setBpm(state.bpm + 1); }
  if (e.key === "ArrowDown") { e.preventDefault(); setBpm(state.bpm - 1); }
});

/* ---------- The iPhone ringer switch (ADVICE §8) ---------- */

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent)
  || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (isIOS) el.hint.textContent = "No sound? Check that your ringer switch isn't on silent.";

/* ---------- Star link (ADVICE §2) ---------- */

if (OWNER && APP_ID !== "local-app") {
  el.star.href = `https://github.com/${OWNER}/${APP_ID}`;
  el.star.hidden = false;
}

/* ---------- Offline (ADVICE §6) ---------- */

if ("serviceWorker" in navigator && isSecureContext) {
  navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
}

render();
</script>
</body>
</html>
