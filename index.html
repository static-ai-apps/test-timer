<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Timer: Kitchen Countdown</title>
<meta name="description" content="A simple countdown timer for the kitchen. Works offline.">
<meta name="theme-color" content="#1f2a24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Test Timer",
  "disambiguatingDescription": "A big, simple countdown timer for the kitchen.",
  "description": "A countdown timer for cooking. Pick a preset or dial in minutes and seconds, start, and get a beep and vibration when time is up. Works offline.",
  "url": "https://static-ai-apps.github.io/test-timer/",
  "applicationCategory": "UtilitiesApplication",
  "featureList": ["Quick presets", "Set minutes and seconds", "Add a minute while running", "Beep and vibration at zero", "Keeps the screen awake while running", "Works offline"],
  "audience": { "@type": "Audience", "audienceType": "Home cooks who want a simple timer" },
  "inLanguage": "en",
  "browserRequirements": "Needs Web Audio for the beep",
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "image": "https://static-ai-apps.github.io/test-timer/icon.png",
  "isPartOf": { "@type": "WebSite", "name": "Static AI Apps", "url": "https://static-ai-apps.github.io/" }
}
</script>
<style>
  :root { color-scheme: dark; --bg:#1f2a24; --surface:#2b3a32; --line:#3e5247; --text:#f4efe2; --muted:#a9b8ac; --accent:#f2b84b; --ink:#1f2a24; --done:#e0584a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { min-height: 100dvh; max-width: 30rem; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto auto; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 20px); }
  h1 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--muted); }
  .stage { display: grid; place-items: center; }
  .dial { position: relative; width: min(78vw, 18rem); aspect-ratio: 1; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--surface); stroke-width: 10; }
  .prog { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; }
  .done .prog { stroke: var(--done); }
  .time { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; align-content: center; }
  .digits { font-size: clamp(3.2rem, 17vw, 4.6rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
  .done .digits { color: var(--done); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .done .digits { animation: none; } }
  .status { color: var(--muted); font-size: .9rem; min-height: 1.4em; }
  .adjust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button { font: inherit; color: inherit; min-height: 48px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; touch-action: manipulation; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  .main { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .go { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; font-size: 1.1rem; min-height: 56px; }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  footer { text-align: center; font-size: .85rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main class="app" id="app">
  <header><h1>Kitchen timer</h1></header>
  <div class="stage">
    <div class="dial">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="prog" id="prog" cx="50" cy="50" r="44" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
      <div class="time"><div><div class="digits" id="digits" role="timer" aria-live="off">05:00</div><div class="status" id="status"></div></div></div>
    </div>
  </div>
  <section class="controls" style="display:grid;gap:8px">
    <div class="adjust" aria-label="Adjust time">
      <button data-add="-60">−1 min</button><button data-add="60">+1 min</button>
      <button data-add="-10">−10 s</button><button data-add="10">+10 s</button>
    </div>
    <div class="presets" aria-label="Presets">
      <button data-set="60">1 min</button><button data-set="180">3 min</button><button data-set="300">5 min</button><button data-set="600">10 min</button>
    </div>
    <div class="main"><button id="reset">Reset</button><button id="go" class="go">Start</button></div>
  </section>
  <footer><a href="https://github.com/static-ai-apps/test-timer">★ Star on GitHub</a></footer>
</main>
<script>
(() => {
  "use strict";
  const REPO = location.pathname.split("/").filter(Boolean)[0] || "test-timer";
  const KEY = REPO + ":duration";
  const $ = (id) => document.getElementById(id);
  const MAX = 99 * 3600 + 59 * 60 + 59;
  let duration = 300, remaining = 300, endAt = 0, running = false, finished = false, tick = 0, wake = null, ctx = null, beepTimer = 0;

  try { const v = parseInt(localStorage.getItem(KEY), 10); if (v >= 1 && v <= MAX) duration = remaining = v; } catch (e) {}

  const fmt = (s) => {
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60, p = (n) => String(n).padStart(2, "0");
    return (h ? h + ":" : "") + p(m) + ":" + p(sec);
  };
  function render() {
    const left = running ? Math.max(0, Math.ceil((endAt - Date.now()) / 1000)) : remaining;
    $("digits").textContent = fmt(left);
    $("prog").style.strokeDashoffset = finished ? 100 : String(100 - 100 * (duration ? left / duration : 0));
    $("app").classList.toggle("done", finished);
    $("go").textContent = finished ? "Stop" : running ? "Pause" : (remaining < duration ? "Resume" : "Start");
    $("status").textContent = finished ? "Time's up!" : running ? "Running" : remaining < duration ? "Paused" : "";
    document.title = (running || finished) ? fmt(left) + " – Test Timer" : "Test Timer: Kitchen Countdown";
    document.querySelectorAll("[data-add],[data-set]").forEach((b) => b.disabled = finished);
    if (running && left <= 0) finish();
  }
  function save() { try { localStorage.setItem(KEY, String(duration)); } catch (e) {} }
  async function lock() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch (e) {} }
  function unlock() { try { wake && wake.release(); } catch (e) {} wake = null; }
  function audio() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) {} }
  function beep() {
    try {
      if (!ctx) return;
      for (let i = 0; i < 3; i++) {
        const t = ctx.currentTime + i * 0.25, o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.2);
      }
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) {}
  }
  function finish() {
    running = false; finished = true; remaining = 0; clearInterval(tick); unlock();
    beep(); beepTimer = setInterval(beep, 3000); render();
  }
  function start() { audio(); if (remaining <= 0) remaining = duration; endAt = Date.now() + remaining * 1000; running = true; clearInterval(tick); tick = setInterval(render, 250); lock(); render(); }
  function pause() { remaining = Math.max(1, Math.ceil((endAt - Date.now()) / 1000)); running = false; clearInterval(tick); unlock(); render(); }
  function reset() { running = false; finished = false; clearInterval(tick); clearInterval(beepTimer); unlock(); remaining = duration; render(); }
  function add(d) {
    if (running) { const left = Math.ceil((endAt - Date.now()) / 1000); const n = Math.min(MAX, Math.max(1, left + d)); endAt = Date.now() + n * 1000; duration = Math.max(duration, n); }
    else { const base = remaining < duration ? remaining : duration; const n = Math.min(MAX, Math.max(1, base + d)); remaining = n; if (n > duration || remaining === n && base === duration) duration = n; save(); }
    render();
  }
  $("go").onclick = () => { if (finished) reset(); else if (running) pause(); else start(); };
  $("reset").onclick = reset;
  document.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => add(+b.dataset.add));
  document.querySelectorAll("[data-set]").forEach((b) => b.onclick = () => { reset(); duration = remaining = +b.dataset.set; save(); render(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (running) lock(); render(); } });
  render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
